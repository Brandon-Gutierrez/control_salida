# Rutas de la API, comunes a las dos entradas de api.conf.template.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain application/json;

# Lo usa el healthcheck del contenedor.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ~ ^/(api|sanctum)/ {
    include /etc/nginx/fastcgi-laravel.conf;
}

# Estado de Laravel.
location = /up {
    include /etc/nginx/fastcgi-laravel.conf;
}

location / {
    return 404;
}
