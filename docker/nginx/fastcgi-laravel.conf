# Reenvío a php-fpm (contenedor "app"). Todas las peticiones de la API entran por
# public/index.php; SCRIPT_NAME fijo evita que Laravel confunda /api/... con
# la ruta del script. Se incluye dentro de un "location".

set $php_upstream app:9000;
fastcgi_pass $php_upstream;

fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME      /index.php;
fastcgi_param DOCUMENT_ROOT    /var/www/html/public;
fastcgi_param DOCUMENT_URI     /index.php;
fastcgi_param REQUEST_URI      $request_uri;
fastcgi_param QUERY_STRING     $query_string;
fastcgi_param REQUEST_METHOD   $request_method;
fastcgi_param CONTENT_TYPE     $content_type;
fastcgi_param CONTENT_LENGTH   $content_length;

fastcgi_param GATEWAY_INTERFACE CGI/1.1;
fastcgi_param SERVER_SOFTWARE   nginx/$nginx_version;
fastcgi_param SERVER_PROTOCOL   $server_protocol;
fastcgi_param REQUEST_SCHEME    $scheme;
fastcgi_param HTTPS             $https if_not_empty;
fastcgi_param REMOTE_ADDR       $remote_addr;
fastcgi_param REMOTE_PORT       $remote_port;
fastcgi_param SERVER_ADDR       $server_addr;
fastcgi_param SERVER_PORT       $server_port;
fastcgi_param SERVER_NAME       $host;
fastcgi_param REDIRECT_STATUS   200;

# Cabeceras de proxy. La API confía en X-Forwarded-* (trustProxies), así que no
# pueden venir del cliente: un fastcgi_param HTTP_* reemplaza a la cabecera de la
# petición con el mismo nombre. $remote_addr ya es la IP real (ver set_real_ip_from
# en el gateway); las demás se eliminan, igual que Proxy (httpoxy).
fastcgi_param HTTP_X_FORWARDED_FOR    $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO  $scheme;
fastcgi_param HTTP_X_FORWARDED_HOST   "" if_not_empty;
fastcgi_param HTTP_X_FORWARDED_PORT   "" if_not_empty;
fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
fastcgi_param HTTP_FORWARDED          "" if_not_empty;
fastcgi_param HTTP_PROXY              "" if_not_empty;

fastcgi_read_timeout 60s;
