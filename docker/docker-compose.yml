# Control de salidas temporales — modo PRODUCCIÓN (base).
#
#   docker compose up -d --build
#
# Servicios: db (PostgreSQL) · redis · app (Laravel + php-fpm) · web (nginx con la
# web Flutter, puerta de entrada de HTTP/HTTPS). Solo "web" publica puertos en el
# host; PostgreSQL y Redis quedan dentro de la red de Docker.
# Para desarrollo se añade docker-compose.dev.yml (ver README_DOCKER.md).

name: control-salidas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Variables de la API, compartidas por los servicios que corren el backend (app y scheduler).
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-ControlSalida}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
  APP_DEBUG: "false"
  APP_URL: https://${PUBLIC_HOST:-localhost}
  APP_TIMEZONE: America/La_Paz
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_LOCALE:-en}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-control_leaves}
  DB_USERNAME: ${DB_USERNAME:-control}
  DB_PASSWORD: ${DB_PASSWORD}

  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-5256000}
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  # Geocerca: radio al predio del QR (m) y peor precisión de GPS aceptada (m).
  GEOFENCE_RADIUS_METERS: ${GEOFENCE_RADIUS_METERS:-50}
  GEOFENCE_MAX_ACCURACY_METERS: ${GEOFENCE_MAX_ACCURACY_METERS:-30}

  # La web y la API comparten dominio: Sanctum acepta el host público y no hace falta CORS.
  SANCTUM_STATEFUL_DOMAINS: ${PUBLIC_HOST:-localhost}
  CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST:-localhost}

  # Servicio externo (Comteco).
  KEY_SOFTWARE: ${KEY_SOFTWARE:-}
  API_LOGIN: ${API_LOGIN:-}
  API_LOGINWITHCARNET: ${API_LOGINWITHCARNET:-}
  API_GETEMPLOYEE: ${API_GETEMPLOYEE:-}
  API_GETREASONS: ${API_GETREASONS:-}
  API_GETCHECKOUT: ${API_GETCHECKOUT:-}
  API_REGISTERCHECKOUT: ${API_REGISTERCHECKOUT:-}

  # Administrador inicial (se identifica por su item del sistema externo).
  SUPERADMIN_ITEM: ${SUPERADMIN_ITEM:-}
  SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-control_leaves}
      POSTGRES_USER: ${DB_USERNAME:-control}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: America/La_Paz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  app:
    image: control-salidas-api:prod
    build:
      # El Dockerfile está en el repositorio del backend.
      context: ${BACKEND_PATH:-..}
      target: prod
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    logging: *default-logging

  # Planificador de Laravel: ejecuta las tareas programadas (sincronización de
  # motivos con Comteco a las 00:00 de lunes a viernes, hora de Bolivia). Debe
  # haber UNA sola instancia; las tareas ya llevan onOneServer por seguridad.
  scheduler:
    image: control-salidas-api:prod
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-environment
      # La API ya migró y sembró: el planificador solo ejecuta tareas.
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    logging: *default-logging

  web:
    image: control-salidas-web:prod
    build:
      # El Dockerfile está en el repositorio de la web.
      context: ${WEB_PATH:-../../web}
      target: prod
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.0}
        API_BASE_URL: ${API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Puerta de entrada: web en "/" y /api, /sanctum hacia el backend, con HTTPS.
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/fastcgi-laravel.conf:/etc/nginx/fastcgi-laravel.conf:ro
      # Coloca aquí fullchain.pem y privkey.pem; si faltan se genera uno autofirmado.
      - ./certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
