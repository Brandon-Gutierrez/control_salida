# API de control de salidas temporales — despliegue en producción.
#
#   docker network create --subnet 172.30.0.0/24 control-salidas   # una sola vez
#   docker compose up -d --build
#
# Servicios: app (Laravel + php-fpm y, con crond, las tareas programadas) y nginx
# (servidor web de la API). La web se despliega aparte, desde su repositorio: si
# está en el mismo servidor llega a nginx por la red compartida "control-salidas".
# PostgreSQL y Redis NO corren en Docker: son servidores externos y se configuran
# en .env. Las migraciones se ejecutan a mano (ver ../README.md).

name: control-salidas-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: control-salidas-api:prod
    build:
      context: ..
      target: prod
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ControlSalida}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      APP_DEBUG: "false"
      APP_URL: https://${PUBLIC_HOST:?Define PUBLIC_HOST en .env}
      APP_TIMEZONE: America/La_Paz
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # PostgreSQL (servidor externo).
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:?Define DB_HOST en .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?Define DB_DATABASE en .env}
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}

      # Redis (servidor externo): tokens QR y comprobantes de salida.
      REDIS_CLIENT: predis
      REDIS_HOST: ${REDIS_HOST:?Define REDIS_HOST en .env}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_SCHEME: ${REDIS_SCHEME:-tcp}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-5256000}
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # Geocerca: radio al predio del QR (m) y peor precisión de GPS aceptada (m).
      GEOFENCE_RADIUS_METERS: ${GEOFENCE_RADIUS_METERS:-50}
      GEOFENCE_MAX_ACCURACY_METERS: ${GEOFENCE_MAX_ACCURACY_METERS:-30}

      # PUBLIC_HOST es la dirección de la web: el navegador llega a la API por ella,
      # así que Sanctum la acepta y no hace falta CORS.
      SANCTUM_STATEFUL_DOMAINS: ${PUBLIC_HOST}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST}

      # Servicio externo (Comteco).
      KEY_SOFTWARE: ${KEY_SOFTWARE:-}
      API_LOGIN: ${API_LOGIN:-}
      API_LOGINWITHCARNET: ${API_LOGINWITHCARNET:-}
      API_GETEMPLOYEE: ${API_GETEMPLOYEE:-}
      API_GETREASONS: ${API_GETREASONS:-}
      API_GETCHECKOUT: ${API_GETCHECKOUT:-}
      API_REGISTERCHECKOUT: ${API_REGISTERCHECKOUT:-}

      # Administrador inicial (se identifica por su item del sistema externo).
      SUPERADMIN_ITEM: ${SUPERADMIN_ITEM:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
    healthcheck:
      # Arranque terminado, php-fpm aceptando conexiones y crond ejecutando las
      # tareas programadas (sincronización de motivos con Comteco). Ver healthcheck.sh.
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Cubre la espera a PostgreSQL y Redis (hasta 2 minutos cada uno): mientras
      # tanto los fallos no cuentan. Después, 5 seguidos lo marcan como no sano.
      start_period: 300s
    logging: *default-logging

  nginx:
    image: control-salidas-api-nginx:prod
    build:
      context: ..
      target: nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Solo para el nombre del certificado autofirmado.
      PUBLIC_HOST: ${PUBLIC_HOST}
      # Origen cuyo X-Forwarded-For se acepta: la red compartida, por donde llega la web.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.30.0.0/24}
    ports:
      # Solo HTTPS. El puerto 80 queda dentro de Docker, para la web.
      - "${API_HTTPS_PORT:-8443}:443"
    volumes:
      # Coloca aquí fullchain.pem y privkey.pem; si faltan se genera uno autofirmado.
      - ./certs:/etc/nginx/certs
    networks:
      default:
      shared:
        aliases:
          # Nombre con el que la web encuentra la API (BACKEND_URL en su .env).
          - control-salidas-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

networks:
  # Se crea a mano una vez; así backend y web se levantan y bajan por separado.
  shared:
    name: ${SHARED_NETWORK:-control-salidas}
    external: true
